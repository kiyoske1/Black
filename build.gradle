plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.kiyoske.blackmarket'
version = '2.0.0'
archivesBaseName = 'blackmarket'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { blackmarket { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }

jar {
    manifest { attributes(['Specification-Title': 'blackmarket', 'Specification-Vendor': 'kiyoske', 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion]) }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar.finalizedBy('reobfJar')
